<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קידום למנהל</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      direction: rtl;
      text-align: right;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-2xl p-8 max-w-md w-full">
    <h1 class="text-3xl font-bold text-indigo-800 mb-6 text-center">קידום למנהל</h1>

    <div id="result" class="mb-4"></div>

    <div class="mb-4">
      <label class="block text-gray-700 font-bold mb-2">אימייל:</label>
      <input
        type="email"
        id="email"
        value="glikman08@gmail.com"
        class="w-full px-4 py-2 border-2 border-indigo-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
        placeholder="הכנס אימייל"
      />
    </div>

    <button
      onclick="promoteAdmin()"
      class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 transition"
    >
      קדם למנהל
    </button>

    <div class="mt-6 pt-6 border-t border-gray-200">
      <p class="text-sm text-gray-600 text-center mb-4">אחרי הקידום:</p>
      <a href="/worker.html" class="block text-center text-indigo-600 hover:text-indigo-700 font-bold mb-2">לדף עובד</a>
      <a href="/admin.html" class="block text-center text-indigo-600 hover:text-indigo-700 font-bold">לדף מנהל</a>
    </div>
  </div>

  <script>
    async function promoteAdmin() {
      const email = document.getElementById('email').value.trim();
      const resultDiv = document.getElementById('result');

      if (!email) {
        resultDiv.innerHTML = '<div class="bg-red-100 text-red-700 p-4 rounded">הכנס אימייל</div>';
        return;
      }

      try {
        const response = await fetch(`/api/promote-admin/${encodeURIComponent(email)}`, {
          method: 'POST',
          credentials: 'include'
        });

        const data = await response.json();

        if (response.ok) {
          resultDiv.innerHTML = `<div class="bg-green-100 text-green-700 p-4 rounded">✓ ${email} קודם למנהל בהצלחה</div>`;
        } else {
          resultDiv.innerHTML = `<div class="bg-red-100 text-red-700 p-4 rounded">✗ שגיאה: ${data.error || 'שגיאה לא ידועה'}</div>`;
        }
      } catch (err) {
        resultDiv.innerHTML = `<div class="bg-red-100 text-red-700 p-4 rounded">✗ שגיאת חיבור: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
