<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דוח נוכחות - עובד</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      direction: rtl;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
      font-size: 14px;
    }

    .login-section {
      text-align: center;
    }

    .login-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 40px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      float: right;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #e5e7eb;
    }

    .user-info h2 {
      color: #333;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .user-info p {
      color: #666;
      font-size: 14px;
    }

    .section {
      margin-bottom: 30px;
    }

    .section h3 {
      color: #333;
      font-size: 18px;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #667eea;
    }

    .check-in-btn {
      width: 100%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 15px;
    }

    .check-in-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
    }

    .check-in-btn:active {
      transform: translateY(0);
    }

    .check-in-list {
      background: #f9fafb;
      border-radius: 8px;
      padding: 15px;
      max-height: 250px;
      overflow-y: auto;
    }

    .check-in-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: white;
      border-radius: 6px;
      margin-bottom: 8px;
      border-right: 3px solid #667eea;
    }

    .check-in-item:last-child {
      margin-bottom: 0;
    }

    .check-in-time {
      font-weight: 600;
      color: #333;
    }

    .check-in-date {
      color: #666;
      font-size: 12px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      direction: rtl;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
    }

    .leaves-list {
      background: #f9fafb;
      border-radius: 8px;
      padding: 15px;
      max-height: 300px;
      overflow-y: auto;
    }

    .leave-item {
      background: white;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      border-right: 3px solid #667eea;
    }

    .leave-item:last-child {
      margin-bottom: 0;
    }

    .leave-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .leave-type {
      font-weight: 600;
      color: #333;
    }

    .leave-status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-approved {
      background: #dcfce7;
      color: #166534;
    }

    .status-rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .leave-dates {
      color: #666;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .leave-reason {
      color: #666;
      font-size: 12px;
      font-style: italic;
    }

    .success-message {
      background: #dcfce7;
      color: #166534;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      border-right: 3px solid #10b981;
    }

    .error-message {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      border-right: 3px solid #ef4444;
    }

    .empty-state {
      text-align: center;
      color: #999;
      padding: 20px;
      font-size: 14px;
    }

    .improvements-section {
      background: #f0f4ff;
      border: 1px solid #d4d8f8;
      border-radius: 8px;
      padding: 15px;
      margin-top: 30px;
    }

    .improvements-section h4 {
      color: #667eea;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .improvements-section ul {
      list-style: none;
      padding-right: 20px;
    }

    .improvements-section li {
      color: #666;
      font-size: 13px;
      margin-bottom: 6px;
      position: relative;
    }

    .improvements-section li:before {
      content: "✓";
      color: #667eea;
      font-weight: bold;
      position: absolute;
      right: -15px;
    }

    .tabs {
      display: flex;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 20px;
      gap: 10px;
    }

    .tab {
      padding: 12px 20px;
      cursor: pointer;
      color: #666;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .tab.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .tab:hover {
      color: #333;
    }

    .loading {
      text-align: center;
      color: #666;
      padding: 20px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      .header h1 {
        font-size: 22px;
      }

      .user-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .logout-btn {
        float: none;
        width: 100%;
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const API_URL = window.location.origin;

    function App() {
      const [user, setUser] = React.useState(null);
      const [loading, setLoading] = React.useState(true);
      const [checkins, setCheckins] = React.useState([]);
      const [leaves, setLeaves] = React.useState([]);
      const [message, setMessage] = React.useState('');
      const [activeTab, setActiveTab] = React.useState('checkin');
      const [leaveForm, setLeaveForm] = React.useState({
        start_date: '',
        end_date: '',
        leave_type: 'vacation',
        reason: ''
      });

      React.useEffect(() => {
        checkAuth();
      }, []);

      const checkAuth = async () => {
        try {
          const response = await fetch(`${API_URL}/auth/user`, { credentials: 'include' });
          if (response.ok) {
            const userData = await response.json();
            setUser(userData);
            loadWorkerData(userData.id);
          }
        } catch (error) {
          console.error('Auth check failed:', error);
        } finally {
          setLoading(false);
        }
      };

      const loadWorkerData = async (userId) => {
        try {
          // Get worker ID first
          const workersRes = await fetch(`${API_URL}/api/workers`, { credentials: 'include' });
          const workers = await workersRes.json();

          // Find worker for this user
          const worker = workers.find(w => w.user_id === userId);
          if (!worker) return;

          // Load check-ins
          const checkinsRes = await fetch(`${API_URL}/api/checkins/worker/${worker.id}`, { credentials: 'include' });
          if (checkinsRes.ok) {
            setCheckins(await checkinsRes.json());
          }

          // Load leaves
          const leavesRes = await fetch(`${API_URL}/api/leaves/${worker.id}`, { credentials: 'include' });
          if (leavesRes.ok) {
            setLeaves(await leavesRes.json());
          }
        } catch (error) {
          console.error('Failed to load worker data:', error);
        }
      };

      const handleCheckIn = async () => {
        try {
          // Get worker ID
          const workersRes = await fetch(`${API_URL}/api/workers`, { credentials: 'include' });
          const workers = await workersRes.json();
          const worker = workers.find(w => w.user_id === user.id);

          if (!worker) {
            setMessage('שגיאה: לא נמצא עובד');
            return;
          }

          const response = await fetch(`${API_URL}/api/checkins`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
              worker_id: worker.id,
              check_in_time: new Date().toISOString()
            })
          });

          if (response.ok) {
            setMessage('✓ הכניסה נרשמה בהצלחה');
            setTimeout(() => setMessage(''), 3000);
            loadWorkerData(user.id);
          }
        } catch (error) {
          setMessage('שגיאה בהרישום');
          console.error(error);
        }
      };

      const handleLeaveSubmit = async (e) => {
        e.preventDefault();

        try {
          const workersRes = await fetch(`${API_URL}/api/workers`, { credentials: 'include' });
          const workers = await workersRes.json();
          const worker = workers.find(w => w.user_id === user.id);

          if (!worker) {
            setMessage('שגיאה: לא נמצא עובד');
            return;
          }

          const response = await fetch(`${API_URL}/api/leaves`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
              worker_id: worker.id,
              ...leaveForm
            })
          });

          if (response.ok) {
            setMessage('✓ בקשת חופש נשלחה בהצלחה');
            setLeaveForm({ start_date: '', end_date: '', leave_type: 'vacation', reason: '' });
            setTimeout(() => setMessage(''), 3000);
            loadWorkerData(user.id);
          }
        } catch (error) {
          setMessage('שגיאה בשליחת הבקשה');
          console.error(error);
        }
      };

      const handleLogout = async () => {
        try {
          await fetch(`${API_URL}/auth/logout`, { credentials: 'include' });
          setUser(null);
          setCheckins([]);
          setLeaves([]);
        } catch (error) {
          console.error('Logout failed:', error);
        }
      };

      if (loading) {
        return (
          <div className="container">
            <div className="loading">טוען...</div>
          </div>
        );
      }

      if (!user) {
        return (
          <div className="container">
            <div className="header">
              <h1>🙋 מערכת נוכחות עובדים</h1>
              <p>התחברו כדי להרשם להנוכחות שלכם</p>
            </div>
            <div className="login-section">
              <a href={`${API_URL}/auth/google`} className="login-btn">
                👤 התחברות עם Google
              </a>
            </div>
          </div>
        );
      }

      return (
        <div className="container">
          <div className="user-header">
            <div className="user-info">
              <h2>{user.name}</h2>
              <p>{user.email}</p>
            </div>
            <button className="logout-btn" onClick={handleLogout}>יציאה</button>
          </div>

          {message && (
            message.includes('✓') ?
              <div className="success-message">{message}</div> :
              <div className="error-message">{message}</div>
          )}

          <div className="tabs">
            <button
              className={`tab ${activeTab === 'checkin' ? 'active' : ''}`}
              onClick={() => setActiveTab('checkin')}
            >
              ✓ כניסה / יציאה
            </button>
            <button
              className={`tab ${activeTab === 'leaves' ? 'active' : ''}`}
              onClick={() => setActiveTab('leaves')}
            >
              📋 בקשות חופש
            </button>
          </div>

          {activeTab === 'checkin' && (
            <div className="section">
              <h3>רישום נוכחות</h3>
              <button className="check-in-btn" onClick={handleCheckIn}>
                ✓ הרשם כניסה
              </button>

              <h3 style={{ marginTop: '25px' }}>בדיקת נוכחות</h3>
              {checkins.length > 0 ? (
                <div className="check-in-list">
                  {checkins.map((c, i) => (
                    <div key={i} className="check-in-item">
                      <div>
                        <div className="check-in-time">
                          {new Date(c.check_in_time).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' })}
                        </div>
                        <div className="check-in-date">
                          {new Date(c.check_in_time).toLocaleDateString('he-IL')}
                        </div>
                      </div>
                      {c.check_out_time && (
                        <div style={{ color: '#666', fontSize: '12px' }}>
                          יציאה: {new Date(c.check_out_time).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' })}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              ) : (
                <div className="empty-state">אין רישומים עדיין</div>
              )}
            </div>
          )}

          {activeTab === 'leaves' && (
            <>
              <div className="section">
                <h3>בקשת חופש חדשה</h3>
                <form onSubmit={handleLeaveSubmit}>
                  <div className="form-group">
                    <label>סוג חופש</label>
                    <select
                      value={leaveForm.leave_type}
                      onChange={(e) => setLeaveForm({ ...leaveForm, leave_type: e.target.value })}
                    >
                      <option value="vacation">חופש</option>
                      <option value="sick">מחלה</option>
                      <option value="personal">יום אישי</option>
                    </select>
                  </div>

                  <div className="form-group">
                    <label>תאריך התחלה</label>
                    <input
                      type="date"
                      value={leaveForm.start_date}
                      onChange={(e) => setLeaveForm({ ...leaveForm, start_date: e.target.value })}
                      required
                    />
                  </div>

                  <div className="form-group">
                    <label>תאריך סיום</label>
                    <input
                      type="date"
                      value={leaveForm.end_date}
                      onChange={(e) => setLeaveForm({ ...leaveForm, end_date: e.target.value })}
                      required
                    />
                  </div>

                  <div className="form-group">
                    <label>הערות (אופציונלי)</label>
                    <textarea
                      value={leaveForm.reason}
                      onChange={(e) => setLeaveForm({ ...leaveForm, reason: e.target.value })}
                      placeholder="הוסף הערות על בקשתך..."
                    ></textarea>
                  </div>

                  <button type="submit" className="submit-btn">שלח בקשה</button>
                </form>
              </div>

              <div className="section">
                <h3>בקשות חופש שלי</h3>
                {leaves.length > 0 ? (
                  <div className="leaves-list">
                    {leaves.map((leave, i) => (
                      <div key={i} className="leave-item">
                        <div className="leave-header">
                          <span className="leave-type">
                            {leave.leave_type === 'vacation' ? '🏖️ חופש' :
                             leave.leave_type === 'sick' ? '🤒 מחלה' :
                             '📋 יום אישי'}
                          </span>
                          <span className={`leave-status status-${leave.status}`}>
                            {leave.status === 'pending' ? 'בהמתנה' :
                             leave.status === 'approved' ? 'אושר' :
                             'דחוי'}
                          </span>
                        </div>
                        <div className="leave-dates">
                          {new Date(leave.start_date).toLocaleDateString('he-IL')} עד {new Date(leave.end_date).toLocaleDateString('he-IL')}
                        </div>
                        {leave.reason && <div className="leave-reason">הערה: {leave.reason}</div>}
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="empty-state">אין בקשות חופש עדיין</div>
                )}
              </div>
            </>
          )}

          <div className="improvements-section">
            <h4>🚀 תכניות עתידיות לשיפור:</h4>
            <ul>
              <li>עמוד פרופיל עם נתונים אישיים</li>
              <li>דוח נוכחות חודשי אישי (PDF)</li>
              <li>הודעות וזכרונות דחף</li>
              <li>סטטיסטיקות נוכחות ודוחות</li>
              <li>בקשה לנוכחות מרחוק</li>
              <li>תיאום קלנדר עם ביומטריקה</li>
            </ul>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
